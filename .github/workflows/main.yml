name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  logic-tests:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the logic tests against mock game classes
        run: |
          mkdir -p .mock/Geode/modify
          cp mock_geode.hpp .mock/Geode/Geode.hpp
          for h in CCKeyboardDispatcher GJBaseGameLayer PlayLayer PlayerObject PauseLayer; do
            echo '#pragma once' > .mock/Geode/modify/$h.hpp
          done
          g++ -std=c++23 -fno-access-control -I.mock logic_tests.cpp -o logic_tests
          ./logic_tests

  build:
    name: Android64 (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
